# Site settings
title: Bruce Blog
SEOTitle: Bruce blog an ee undergraduate
header-img: img/home-bg.jpg
email: aletymode@gmail.com
description: "Bruce 的个人博客，记录 EE 学习、机器人和独立游戏。"
keyword: "Bruce, EE, Electronics, Robot, Indie Game, Blog"
url: "https://lpiney.github.io" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
github_username: Lpiney
bilibili_uid: 520375984
#facebook_username:  huxpro
#linkedin_username:  firstname-lastname-idxxxx

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus settings
disqus_username: false

# Valine settings
valine_comment: true
valine_appId: 0VgTwoy6FtL8y9N98LUnniJRiD5wEYosE9S9hcWR9yB51FwjlVdz1iceCGjMHd6C-us-w1
valine_appKey: 0VgTwoy6FtL8y9N98LUnniJRiD5wEYosE9S9hcWR9yB51FwjlVdz1iceCGjMHd6C-us-w1
valine_placeholder: "快来评论吧~ (支持 Markdown)"
# valine_serverURLs: "https://xxx.api.lncldglobal.com" # 国际版可能需要配置 REST API 服务器地址

# Busuanzi settings
busuanzi: true
start_date: "2026-01-01" # 博客启动时间

# Netease settings
netease_comment: false

# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics
ga_track_id: false
ga_domain: auto
ga4_measurement_id: false

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "在读理科生，喜欢机器人和独立游戏"
sidebar-avatar: https://github.com/Lpiney.png # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 0 # A tag will be featured if the size of it is more than this condition value

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false

# Friends
friends:
  []
